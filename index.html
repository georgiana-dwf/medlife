<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23075eab'/%3E%3Cpath d='M14 7h4v7h7v4h-7v7h-4v-7H7v-4h7z' fill='white'/%3E%3C/svg%3E">
  <title>Shop MedLife — abonamente și pachete medicale</title>
  <style>
    :root {
      --navy: #12284c;
      --navy-2: #0b1f3a;
      --blue: #185fa5;
      --blue-hover: #124f8c;
      --cyan: #185fa5;
      --cyan-soft: #e9f7fc;
      --ink: #10243f;
      --muted: #53657b;
      --line: #d9e2ea;
      --canvas: #f5f8fa;
      --surface: #ffffff;
      --success: #176b49;
      --success-soft: #e9f6ef;
      --error: #a32430;
      --error-soft: #fff0f1;
      --warm: #e6a100;
      --cart: #f5b800;
      --cart-hover: #dda600;
      --deal: #b42332;
      --focus: #f1a900;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(9, 39, 75, .10);
      --font: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
      color-scheme: light;
    }
 
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--surface);
      color: var(--ink);
      font: 400 16px/1.55 var(--font);
      text-rendering: optimizeLegibility;
    }
    body.menu-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: var(--blue); }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { color: var(--navy-2); letter-spacing: -.025em; }
    h1 { max-width: 13ch; margin-bottom: 20px; font-size: clamp(2.5rem, 6vw, 4.75rem); line-height: 1.02; }
    h2 { margin-bottom: 14px; font-size: clamp(1.8rem, 3.5vw, 2.65rem); line-height: 1.12; }
    h3 { margin-bottom: 8px; font-size: 1.25rem; line-height: 1.25; }
    p { margin-bottom: 16px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    h1[tabindex="-1"]:focus { outline: none; }
    .container { width: min(1180px, calc(100% - 40px)); margin-inline: auto; }
    .page { min-height: 70vh; }
    .section { padding-block: clamp(48px, 6vw, 72px); }
    .section-tight { padding-block: 40px; }
    .muted { color: var(--muted); }
    .lead { max-width: 64ch; color: var(--muted); font-size: clamp(1.06rem, 2vw, 1.25rem); line-height: 1.55; }
    .stack { display: grid; gap: 16px; }
 
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line);
    }
    .header-main { min-height: 76px; display: flex; align-items: center; gap: 28px; }
    .brand { display: inline-flex; flex: 0 0 auto; align-items: center; min-height: 48px; padding: 6px 0; border-radius: 6px; }
    .brand img { width: 250px; height: auto; }
    .desktop-nav { display: flex; flex: 1; align-items: center; justify-content: center; gap: 4px; }
    .nav-link, .icon-button, .menu-button {
      min-height: 44px; border: 0; background: transparent; cursor: pointer;
    }
    .nav-link { padding: 10px 12px; border-radius: 10px; color: var(--ink); font-weight: 650; }
    .nav-link:hover { background: var(--canvas); color: var(--blue); }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .icon-button, .menu-button {
      position: relative; width: 46px; display: inline-grid; place-items: center; border-radius: 10px;
    }
    .icon-button:hover, .menu-button:hover { background: var(--canvas); }
    .icon-button svg, .menu-button svg { width: 23px; height: 23px; }
    .cart-count {
      position: absolute; top: 3px; right: 1px; display: grid; place-items: center;
      min-width: 19px; height: 19px; padding: 0 5px; border: 2px solid white; border-radius: 10px;
      background: var(--cyan); color: white; font-size: 11px; font-weight: 800;
    }
    .menu-button { display: none; }
 
    .mobile-drawer {
      position: fixed; inset: 0; z-index: 70; display: none; background: rgba(4, 21, 45, .46);
    }
    .mobile-drawer.open { display: block; }
    .drawer-panel {
      width: min(100vw, 420px); height: 100%; margin-left: auto; padding: 20px;
      overflow: auto; background: white; box-shadow: -16px 0 36px rgba(4, 21, 45, .18);
    }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .drawer-head img { width: 220px; }
    .drawer-nav { display: grid; }
    .drawer-section-label { margin: 24px -8px 8px; padding: 10px 12px; border-radius: 8px; background: #eaf3fa; color: var(--navy); font-size: .78rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .drawer-nav button {
      min-height: 52px; padding: 12px 8px; border: 0; border-bottom: 1px solid #c7d5e0;
      background: white; color: var(--navy); text-align: left; font-weight: 750; cursor: pointer;
    }
    .drawer-nav button:hover { background: #f3f7fa; color: var(--blue); }
    .drawer-group { margin-top: 32px; }
    .drawer-group a { display: block; min-height: 44px; padding-block: 10px; color: var(--muted); }
 
    .btn {
      min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 12px 20px; border: 1px solid transparent; border-radius: 12px;
      text-decoration: none; font-weight: 750; cursor: pointer; transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--blue); color: white; box-shadow: 0 8px 18px rgba(7, 94, 171, .20); }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-cart { background:var(--cart); color:var(--navy-2); box-shadow:0 8px 18px rgba(198,143,0,.24); }
    .btn-cart:hover { background:var(--cart-hover); }
    .btn-cart[disabled] { background:#d8e0e7; color:#677686; box-shadow:none; }
    .btn-secondary { border-color: var(--blue); background: white; color: var(--blue); }
    .btn-secondary:hover { background: #f3f8fc; }
    .btn-quiet { background: var(--canvas); color: var(--navy); }
    .btn[disabled] { background: #d8e0e7; color: #677686; box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-block { width: 100%; }
    .button-row { display: flex; flex-wrap: wrap; gap: 12px; }
 
    .hero { background: var(--cyan-soft); }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(440px, .9fr); min-height: 420px; }
    .hero-copy { align-self: center; padding: 48px max(34px, 5vw) 48px max(20px, calc((100vw - 1180px) / 2)); }
    .hero-copy h1 { max-width: 12ch; font-size: clamp(2.5rem, 4.35vw, 4rem); }
    .hero-copy .lead { max-width: 580px; margin-bottom: 30px; color: #334e69; }
    .hero-image { min-height: 420px; overflow: hidden; }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; object-position: 55% center; }
    .hero-placeholder { height: 100%; min-height: 560px; display: grid; place-items: center; padding: 32px; background: linear-gradient(145deg,#d7e4ec,#edf3f7); }
    .hero-placeholder-inner { width: min(360px,80%); aspect-ratio: 4/3; display:grid; place-items:center; gap:12px; align-content:center; border:1px solid #a9bdcc; border-radius:16px; background:rgba(255,255,255,.48); color:#3c566c; text-align:center; }
    .hero-placeholder-inner svg { width:40px; color:var(--blue); }
 
    .choice-band { background: var(--navy); color: white; }
    .choice-grid { display: grid; grid-template-columns: 1.05fr 1fr 1fr 1fr; }
    .choice-intro, .choice-item { padding: 34px 30px; }
    .choice-item { border-left: 1px solid rgba(255,255,255,.20); }
    .choice-band h2, .choice-band h3 { color: white; }
    .choice-band h2 { margin: 0; font-size: 1.8rem; }
    .choice-item p { margin: 0; color: #d9e7f4; }
 
    .audience-paths { padding: 48px 0; background: var(--surface); }
    .audience-paths-head { max-width: 700px; margin-bottom: 28px; }
    .audience-paths-head h2 { margin-bottom: 10px; }
    .audience-path-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .audience-path {
      display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 20px;
      min-height: 152px; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: white; text-align: left;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .audience-path:hover { transform:translateY(-2px); border-color:#b9cfdf; box-shadow:0 12px 28px rgba(9,39,75,.09); }
    .audience-path.company { background: var(--navy); color: white; }
    .audience-path.company h3, .audience-path.company p { color: white; }
    .audience-path-icon { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: var(--cyan-soft); color: var(--blue); }
    .audience-path-icon svg { width: 28px; }
    .audience-path h3 { margin: 0 0 6px; }
    .audience-path p { margin: 0; color: var(--muted); }
 
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
    .section-head h2 { max-width: 18ch; margin-bottom: 0; }
    .section-head p { max-width: 54ch; margin-bottom: 3px; }
    .category-directory { border-top: 1px solid var(--line); }
    .category-row {
      width: 100%; display: grid; grid-template-columns: 72px minmax(220px, .8fr) 1.2fr 48px;
      align-items: center; gap: 24px; min-height: 124px; padding: 20px 8px;
      border: 0; border-bottom: 1px solid var(--line); background: white; text-align: left; cursor: pointer;
    }
    .category-row { transition:background-color .18s ease; }
    .category-row:hover { background: var(--canvas); }
    .category-row:hover .row-arrow { transform:translateX(4px); }
    .category-mark {
      width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px;
      background: var(--cyan-soft); color: var(--blue);
    }
    .category-mark svg { width: 27px; height: 27px; }
    .category-row h3, .category-title { margin: 0; color: var(--navy-2); font-size: 1.25rem; font-weight: 750; line-height: 1.25; letter-spacing: -.025em; }
    .category-row p { margin: 0; color: var(--muted); }
    .row-arrow { color: var(--blue); transition:transform .18s ease; }
    .row-arrow svg { width: 24px; }
 
    .featured { background: var(--canvas); }
    .home-carousel { padding:48px 0; overflow:hidden; }
    .home-carousel.consumer { background:white; }
    .home-carousel.company { background:var(--navy); color:white; }
    .home-carousel.company h2 { color:white; }
    .home-carousel.company .carousel-head p { color:#d9e7f4; }
    .carousel-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:24px; }
    .carousel-head h2 { margin-bottom:6px; }
    .carousel-head p { margin:0; color:var(--muted); }
    .carousel-actions { display:flex; align-items:center; gap:8px; }
    .carousel-arrow { width:48px; height:48px; display:grid; place-items:center; flex:0 0 auto; border:1px solid var(--line); border-radius:12px; background:white; color:var(--blue); cursor:pointer; }
    .carousel-arrow:hover { background:var(--cyan-soft); }
    .carousel-arrow svg { width:20px; }
    .carousel-arrow.prev svg { transform:rotate(180deg); }
    .company .carousel-arrow { border-color:rgba(255,255,255,.38); background:transparent; color:white; }
    .company .carousel-arrow:hover { background:rgba(255,255,255,.12); }
    .company .carousel-all { border-color:white; background:white; color:var(--navy); }
    .product-carousel { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(300px,calc((100% - 40px)/3)); gap:20px; padding:4px 4px 24px; overflow-x:auto; overscroll-behavior-inline:contain; scroll-snap-type:inline mandatory; scrollbar-width:thin; scrollbar-color:#aebdca transparent; }
    .product-carousel .product-card { scroll-snap-align:start; }
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }
    .product-card {
      display: flex; flex-direction: column; min-width: 0; overflow: hidden; border-radius: var(--radius);
      background: white; box-shadow: 0 7px 24px rgba(9, 39, 75, .08); transition:transform .18s ease, box-shadow .18s ease;
    }
    .product-card:hover { transform:translateY(-4px); box-shadow:0 16px 36px rgba(9,39,75,.13); }
    .product-visual { min-height: 128px; display: flex; flex-direction: column; justify-content: end; padding: 24px; background: #e9f4fb; }
    .product-visual.child { background: #f0eefb; }
    .product-visual.package { background: #ecf7f1; }
    .product-visual.company { background: #e8eef6; }
    .product-visual.sport { background: #eef1f8; }
    .product-visual.dental { background: #f7f1ec; }
    .product-family { margin-bottom: 8px; color: var(--blue); font-weight: 700; }
    .product-visual h3 { max-width: 14ch; margin: 0; color: var(--navy-2); font-size: 1.55rem; line-height: 1.1; }
    .product-body { flex: 1; display: flex; flex-direction: column; padding: 24px; }
    .product-body p { color: var(--muted); }
    .card-specs { display: grid; gap: 0; margin: 8px 0 20px; border-top: 1px solid var(--line); }
    .card-specs div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .card-specs dt { color: var(--muted); }
    .card-specs dd { margin: 0; color: var(--navy-2); font-weight: 700; text-align: right; }
    .price { margin-top: auto; margin-bottom: 18px; color: var(--navy-2); }
    .price strong { font-size: 1.55rem; letter-spacing: -.02em; }
    .price span { color: var(--muted); }
    .card-action { width: 100%; }
    .product-badge { align-self: flex-start; margin-bottom: 10px; padding: 5px 9px; border-radius: 999px; background: var(--warm); color: #12284c; font-size: .78rem; font-weight: 850; }
    .product-box { position: relative; width: 118px; height: 92px; margin: 4px auto 22px; transform: rotate(-4deg); filter: drop-shadow(0 14px 15px rgba(8,46,97,.16)); }
    .product-box::before { content:""; position:absolute; inset:10px 8px 0 0; border-radius:8px; background:linear-gradient(145deg,#fff 0 54%,#dbeaf5 55%); border:1px solid rgba(8,46,97,.12); }
    .product-box::after { content:"+"; position:absolute; left:42px; top:28px; width:34px; height:34px; display:grid; place-items:center; border-radius:8px; background:var(--box-accent,#e8b25b); color:white; font-size:26px; font-weight:800; }
    .product-visual.child .product-box { --box-accent:#ef7d78; }
    .product-visual.package .product-box { --box-accent:#55a68a; }
    .card-benefits { display:grid; gap:0; margin:4px 0 20px; padding:0; border-top:1px solid var(--line); list-style:none; }
    .card-benefits li { display:grid; grid-template-columns:96px 1fr; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.9rem; line-height:1.35; }
    .benefit-label { color:var(--muted); font-weight:600; }
    .benefit-value { color:var(--navy-2); font-weight:650; }
 
    .trust-strip { background:var(--navy); color:white; }
    .trust-list { display:grid; grid-template-columns:repeat(4,1fr); margin:0; padding:18px 0; list-style:none; }
    .trust-list li { min-height:44px; display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 18px; border-left:1px solid rgba(255,255,255,.2); text-align:center; font-weight:700; }
    .trust-list li:first-child { border-left:0; }
    .trust-list svg { flex:0 0 auto; width:20px; color:#73cdf0; }
    .guide-card { display:grid; grid-template-columns:1fr auto; align-items:center; gap:32px; padding:32px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(120deg,#f4fbfe,#fff); }
    .guide-card h2,.guide-card p { margin-bottom:8px; }
    .reason-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .reason { padding:24px; border-top:4px solid var(--blue); background:var(--canvas); border-radius:0 0 12px 12px; }
    .reason h3 { font-size:1.08rem; }
    .reason p { margin:0; color:var(--muted); }
    .faq-list { max-width:840px; margin:auto; }
 
    .how-it-works { background:var(--navy); color:white; }
    .how-grid { display:grid; grid-template-columns:auto repeat(3,1fr); align-items:center; gap:0; }
    .how-grid h2 { margin:0 34px 0 0; color:white; font-size:1.45rem; }
    .how-step { min-height:88px; display:flex; align-items:center; gap:12px; padding:18px 24px; border-left:1px solid rgba(255,255,255,.2); }
    .how-step b { width:34px; height:34px; display:grid; place-items:center; flex:0 0 auto; border-radius:50%; background:white; color:var(--navy); }
    .category-usps { padding:16px 0; background:var(--canvas); }
    .category-usp-list { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:0; padding:0; list-style:none; }
    .category-usp-list li { min-height:68px; display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid #d8e4ed; border-radius:12px; background:white; color:var(--navy); font-size:.9rem; line-height:1.3; font-weight:600; box-shadow:0 4px 14px rgba(9,39,75,.05); }
    .category-usp-list svg { box-sizing:content-box; flex:0 0 auto; width:18px; padding:8px; border-radius:10px; background:var(--cyan-soft); color:var(--blue); }
    .plan-guide { margin-top:8px; padding:28px; border:1px solid var(--line); border-radius:16px; background:#f7fbfd; }
    .plan-guide h2 { font-size:1.65rem; }
    .plan-questions { display:flex; flex-wrap:wrap; gap:8px; }
    .plan-questions button { min-height:44px; padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:white; color:var(--navy); font-weight:700; cursor:pointer; }
    .plan-questions button[aria-pressed="true"] { border-color:var(--blue); background:#eaf5fb; color:var(--blue); }
 
    .product-audience { margin:-4px 0 16px; color:var(--blue); font-weight:800; }
    .pdp-highlights { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0; }
    .pdp-highlight { display:grid; grid-template-columns:34px 1fr; align-items:center; gap:10px; padding:12px; border:1px solid #d5e5ef; border-radius:12px; background:#f8fcfe; color:#263f5e; font-size:.9rem; line-height:1.35; font-weight:600; }
    .pdp-highlight svg { box-sizing:content-box; width:16px; padding:8px; border-radius:9px; background:var(--cyan-soft); color:var(--blue); }
    .pdp-services { padding:48px 0; }
    .service-groups { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .service-group { border:1px solid var(--line); border-radius:14px; background:white; overflow:hidden; transition:border-color .18s ease, background-color .18s ease; }
    .service-group[open] { border-color:#b9d8e9; background:#fbfdff; }
    .service-group[open] summary { color:var(--blue); }
    .service-group summary { padding:0 20px; }
    .service-group > div { padding:0 20px 20px; }
    .service-group p,.service-group li { color:var(--muted); }
    .service-group ul { margin:0; padding-left:20px; }
    .decision-docs { margin:20px 0 4px; padding:18px; border:1px solid #bad7e8; border-radius:12px; background:#f3fbff; }
    .decision-docs strong { display:block; margin-bottom:6px; }
    .cross-sell { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center; margin-top:32px; padding:24px; border-radius:16px; background:var(--navy); color:white; }
    .cross-sell h2,.cross-sell p { color:white; margin-bottom:6px; }
    .cross-sell .btn { background:white; color:var(--navy); }
    .variant-selector { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
    .variant-option { min-height:64px; padding:10px 12px; border:1px solid #9eafbd; border-radius:12px; background:white; color:var(--navy); text-align:left; font-weight:750; cursor:pointer; }
    .variant-option[aria-pressed="true"] { border:2px solid var(--blue); background:#eaf3fa; }
    .variant-copy { margin:-4px 0 20px; color:var(--muted); }
    .pdp-faq { padding:48px 0; background:var(--canvas); }
    .pdp-faq .faq-list { max-width:780px; margin:0 auto; }
    .pdp-faq h2 { margin-bottom:24px; }
    .pdp-faq details { padding:0 4px; border:0; border-bottom:1px solid var(--line); background:transparent; }
    .pdp-faq details:first-of-type { border-top:1px solid var(--line); }
    .pdp-faq summary { min-height:64px; font-size:1rem; font-weight:650; }
    .pdp-faq summary span { width:28px; height:28px; display:grid; place-items:center; flex:0 0 auto; border-radius:50%; background:white; color:var(--blue); font-size:1.25rem; font-weight:500; transition:transform .18s ease, background-color .18s ease; }
    .pdp-faq details[open] summary span { transform:rotate(45deg); background:var(--cyan-soft); }
    .pdp-faq details p { margin:-4px 44px 20px 0; color:#455b72; line-height:1.6; }
 
    .company-banner { background: var(--navy); color: white; }
    .company-banner .container { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 40px; }
    .company-banner h2 { max-width: 22ch; color: white; }

    function alignBreadcrumb() {

    function render() {
      document.body.dataset.screen = model.screen;

    function closeOverlays() { model.menuOpen = false; model.searchOpen = false; model.cartSheet = false; document.body.classList.remove('menu-open'); }

      const action = model.returnFocusAction;

    function showToast(message) {

      model.toastTimer = setTimeout(() => region.innerHTML = '', 3200);
    }
    function route(screen) { model.screen = screen; closeOverlays(); render(); goTop(); requestAnimationFrame(() => { const heading=document.querySelector('#app h1'); if (heading) { heading.tabIndex=-1; heading.focus({preventScroll:true}); } }); }
    function setProduct(id) {
      const product = productById(id); model.productId = id; model.categoryId = product.category; model.subcategoryId = product.subcategory; model.periodId = product.periods?.[0]?.id || ''; model.variantId = product.id === 'femei-30' ? 'laborator' : Object.keys(product.variants || {})[0] || ''; model.city=''; model.unit=''; model.errors={}; route('product');
    }
    function addToCart(product) {
      const locationNeeded = product.kind === 'one-off' && product.category === 'pachete';
      model.errors = {};
      if (locationNeeded && !model.city) model.errors.city = true;
      else if (locationNeeded && !model.unit) model.errors.unit = true;
      if (Object.keys(model.errors).length) { render(); document.querySelector('[aria-invalid="true"]')?.focus(); return; }
      const period = currentPeriod(product);
      const previous = model.editingCartIndex !== null ? model.cart[model.editingCartIndex] : null;
      const item = {productId:product.id,periodId:period?.id || null,periodLabel:period?.label || null,variantId:model.variantId || null,variantLabel:product.variants?.[model.variantId]?.label || null,total:period?.total || product.amount,city:model.city,unit:model.unit,beneficiaryType:previous?.beneficiaryType || 'self',beneficiaryName:previous?.beneficiaryName || ''};
      if (model.editingCartIndex !== null) { model.cart[model.editingCartIndex]=item; model.addedCartIndex=model.editingCartIndex; model.editingCartIndex=null; }
      else { model.cart.push(item); model.addedCartIndex=model.cart.length-1; }
      model.cartSheet = true; render();

    function validate(names) {
      model.errors = {};
      names.forEach(name => { const value = String(model.checkoutData[name] || '').trim(); if (!value) model.errors[name] = 'Completează acest câmp.'; });
      if (model.checkoutData.email && !/^\S+@\S+\.\S+$/.test(model.checkoutData.email)) model.errors.email = 'Introdu o adresă de e-mail validă.';
      if (names.includes('cnp') && model.checkoutData.cnp && !/^\d{13}$/.test(String(model.checkoutData.cnp).replace(/\s/g,''))) model.errors.cnp = 'CNP-ul trebuie să aibă 13 cifre.';
      if (names.includes('beneficiaryCnp') && model.checkoutData.beneficiaryCnp && !/^\d{13}$/.test(String(model.checkoutData.beneficiaryCnp).replace(/\s/g,''))) model.errors.beneficiaryCnp = 'CNP-ul trebuie să aibă 13 cifre.';
      if (names.includes('phone') && model.checkoutData.phone && String(model.checkoutData.phone).replace(/\D/g,'').length < 8) model.errors.phone = 'Introdu un număr de telefon valid.';
      if (names.includes('employees') && Number(model.checkoutData.employees) < 1) model.errors.employees = 'Introdu numărul de angajați.';
      return Object.keys(model.errors).length === 0;
    }
 
    function collectForm(form) {
      form.querySelectorAll('[data-checkout-field]').forEach(el => model.checkoutData[el.name]=el.value);
      form.querySelectorAll('[data-checkout-check]').forEach(el => model.checkoutData[el.name]=el.checked);
      form.querySelectorAll('[data-person-field]').forEach(el => {
        const record = el.dataset.personKey === 'self' ? model.checkoutData : (model.beneficiaryData[el.dataset.personKey] ||= {});
        record[el.dataset.personField] = el.value;
      });
    }
    function validateIdentity(form,hasSubscription) {
      model.errors = {};
      form.querySelectorAll('[data-person-field]').forEach(el => {
        const safe = el.dataset.personKey.replace(/[^a-z0-9-]/gi,'');
        const errorKey = `${safe}-${el.dataset.personField}`;
        const value = String(el.value || '').trim();
        if (!value) model.errors[errorKey] = 'Completează acest câmp.';
        if (el.dataset.personField === 'cnp' && value && !/^\d{13}$/.test(value.replace(/\s/g,''))) model.errors[errorKey] = 'CNP-ul trebuie să aibă 13 cifre.';
      });
      if (hasSubscription && !String(model.checkoutData.activationDate || '').trim()) model.errors.activationDate = 'Alege data de activare.';
      return Object.keys(model.errors).length === 0;
    }
    function focusFirstError() { requestAnimationFrame(() => document.querySelector('[aria-invalid="true"], #terms')?.focus()); }
    function advanceCheckout(form) {
      collectForm(form);
      const hasSubscription = model.cart.some(item=>productById(item.productId).kind==='subscription');
      if (model.checkoutStep === 1 && !validate(['email','lastName','firstName','phone','address'])) { render(); focusFirstError(); return; }
      if (model.checkoutStep === 2 && !validateIdentity(form,hasSubscription)) { render(); focusFirstError(); return; }
      if (model.checkoutStep === 3) {
        model.errors = {};
        if (!model.checkoutData.terms) { model.errors.terms='Acceptă contractul și condițiile produsului pentru a continua.'; render(); focusFirstError(); return; }
        model.successKind='order'; route('success'); return;

      model.errors = {}; model.checkoutStep += 1; render(); goTop();
      requestAnimationFrame(() => document.querySelector('.checkout-title h1')?.focus?.());

    function submitOffer(form) {
      collectForm(form);
      if (!validate(['firstName','lastName','email','phone','company','cui','employees'])) { render(); focusFirstError(); return; }
      model.successKind='offer'; route('success');
    }
 
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]'); if (!target) return;
      const action = target.dataset.action;
      if (target.tagName === 'A' && target.getAttribute('href') === '#') event.preventDefault();

        model.categoryId = company ? 'companii' : 'abonamente';

      if (action === 'toggle-menu') { if (model.menuOpen) closeOverlayAndRestore(); else { model.returnFocusAction='toggle-menu'; model.menuOpen=true; renderHeader(); renderDrawer(); } }
      if (action === 'toggle-search') { if (model.searchOpen) closeOverlayAndRestore(); else { model.returnFocusAction='toggle-search'; model.menuOpen=false; model.searchOpen=true; renderHeader(); renderDrawer(); renderSearch(); } }
      if (action === 'open-category') { model.categoryId=target.dataset.category; model.subcategoryId=categoryById(model.categoryId).subcategories[0]?.id || null; model.errors={}; route('category'); }
      if (action === 'open-subcategory') { model.subcategoryId=target.dataset.subcategory || null; route('category'); }
      if (action === 'open-product') { model.editingCartIndex=null; setProduct(target.dataset.product); }
      if (action === 'select-period') { model.periodId=target.dataset.period; render(); }
      if (action === 'select-variant') { model.variantId=target.dataset.variant; model.city=''; model.unit=''; model.errors={}; render(); }
      if (action === 'guide-choice') { model.guideChoice=target.dataset.guide; render(); }
      if (action === 'scroll-carousel') { const rail=document.getElementById(target.dataset.target); rail?.scrollBy({left:Number(target.dataset.direction)*Math.min(rail.clientWidth*.85,720),behavior:'smooth'}); }
      if (action === 'select-beneficiary') { model.beneficiaryType=target.dataset.beneficiary; model.errors={}; render(); }
      if (action === 'product-cta') {
        const product = productById(model.productId);
        if (product.route === 'cart') addToCart(product);

      if (action === 'cart-sheet-goto') { model.cartSheet=false; route('cart'); }

      if (action === 'edit-cart' && model.cart.length) { const index=Number(target.dataset.index); const item={...model.cart[index]}; setProduct(item.productId); model.editingCartIndex=index; model.periodId=item.periodId || ''; model.variantId=item.variantId || model.variantId; model.city=item.city || ''; model.unit=item.unit || ''; render(); }
      if (action === 'remove-cart') { model.cart.splice(Number(target.dataset.index),1); render(); }
      if (action === 'apply-promo') { model.promoCode=document.getElementById('promo-code')?.value || ''; showToast(model.promoCode ? 'Codul nu este valabil pentru produsele din coș.' : 'Introdu un cod de reducere.'); }
      if (action === 'checkout') { model.checkoutStep=1; model.errors={}; route('checkout'); }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && model.cartSheet) { model.cartSheet=false; render(); return; }

      if (event.key === 'Tab' && (model.menuOpen || model.searchOpen || model.cartSheet)) {
        const overlay = model.cartSheet ? document.getElementById('cart-sheet') : model.menuOpen ? document.getElementById('mobile-drawer') : document.getElementById('search-layer');
        const focusable = [...overlay.querySelectorAll('button, a, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
        if (!focusable.length) return;
        const first=focusable[0], last=focusable[focusable.length-1];

      }
    });
    document.getElementById('mobile-drawer').addEventListener('click', event => { if (event.target.id === 'mobile-drawer') closeOverlayAndRestore(); });
    document.getElementById('search-layer').addEventListener('click', event => { if (event.target.id === 'search-layer') closeOverlayAndRestore(); });
    document.getElementById('cart-sheet').addEventListener('click', event => { if (event.target.id === 'cart-sheet') { model.cartSheet=false; render(); } });
    window.addEventListener('resize', () => requestAnimationFrame(alignBreadcrumb));
 
    window.medlifeShop = {
      home: () => route('home'),
      category: id => { model.categoryId=id; model.subcategoryId=categoryById(id).subcategories[0]?.id || null; route('category'); },
      product: id => setProduct(id),
      cart: () => route('cart'),
      reset: () => { model.cart=[]; model.checkoutStep=1; model.beneficiaryType='self'; model.errors={}; route('home'); }
    };
 
    render();
  </script>
</body>
</html>
